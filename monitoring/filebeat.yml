apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: monitoring
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/lib/docker/containers/*/*.log
        processors:
          - add_docker_metadata:
              host: "unix:///var/run/docker.sock"

    output.elasticsearch:
      hosts: ["elasticsearch:9200"]
      protocol: "https"
      username: "elastic"
      password: "${ELASTICSEARCH_PASSWORD}"

    setup.kibana:
      host: "kibana:5601"

    processors:
      - add_host_metadata:
          when.not.contains.tags: forwarded
      - add_cloud_metadata: ~
      - add_docker_metadata: ~
      - add_kubernetes_metadata: ~