apiVersion: apps/v1
kind: Deployment
metadata:
  name: storeweb-frontend
  namespace: storeweb
  labels:
    app: storeweb-frontend
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: storeweb-frontend
  template:
    metadata:
      labels:
        app: storeweb-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/${{ github.repository }}-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
              name: http
          env:
            - name: VITE_API_URL
              value: "http://storeweb-backend:8000"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 5